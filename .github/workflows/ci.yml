name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build the plugin
        run: npm run build

      - name: Confirm the xpi was produced
        run: |
          ls -la .scaffold/build/*.xpi
          test -f .scaffold/build/*.xpi
