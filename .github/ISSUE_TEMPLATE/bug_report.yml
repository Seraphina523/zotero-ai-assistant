name: 问题反馈
description: 报告 bug 或异常行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请尽量填写完整，这能显著加快定位速度。
        **请不要在 Issue 中粘贴 API Key。**

  - type: input
    id: zotero-version
    attributes:
      label: Zotero 版本
      placeholder: 例如 10.0.6
    validations:
      required: true

  - type: input
    id: plugin-version
    attributes:
      label: 插件版本
      description: 设置面板底部可以看到
      placeholder: 例如 0.1.0
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: 使用的服务商
      options:
        - OpenAI
        - Anthropic Claude
        - DeepSeek
        - 通义千问 Qwen
        - 智谱 GLM
        - Kimi / Moonshot
        - 硅基流动
        - 火山方舟 Ark
        - Ollama（本地）
        - 其他 / 自定义
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么
      description: 你期望的结果 vs 实际结果
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: 错误信息
      description: 完整的错误文本，不要截断
      render: text
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 选中某篇文献
        2. 点击「生成摘要」
        3. 出现错误 ...
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已尝试「测试连接」并确认配置正确
          required: false
        - label: 我已搜索过现有 Issue，没有重复
          required: false
        - label: 我确认错误信息中没有包含 API Key
          required: true
